<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>Character test 2</title>
<style>body{margin:0;background:#9cc3e5}</style>
<script type="importmap">
{"imports":{"three":"../vendor/three.module.min.js","three/addons/":"../vendor/addons/"}}
</script>
</head>
<body>
<script type="module">
import * as THREE from 'three';
import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
import { MeshoptDecoder } from 'three/addons/libs/meshopt_decoder.module.js';
import { clone as cloneSkinned } from 'three/addons/utils/SkeletonUtils.js';
import { normalizeModel, findClip } from '../src/core/assets.js';

const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setSize(960, 540);
document.body.appendChild(renderer.domElement);
const scene = new THREE.Scene();
scene.background = new THREE.Color(0x9cc3e5);
scene.add(new THREE.HemisphereLight(0xffffff, 0x8a7a5f, 1.2));
const sun = new THREE.DirectionalLight(0xfff2dd, 2.5);
sun.position.set(5, 10, 7);
scene.add(sun);
const camera = new THREE.PerspectiveCamera(50, 960 / 540, 0.1, 100);
camera.position.set(0, 1.4, 9);
camera.lookAt(0, 1.0, 0);
scene.add(new THREE.GridHelper(14, 14, 0x333333, 0x666666));

const loader = new GLTFLoader();
loader.setMeshoptDecoder(MeshoptDecoder);
const mixers = [];
const info = [];
function boxOf(o) {
  const box = new THREE.Box3().setFromObject(o);
  const s = box.getSize(new THREE.Vector3());
  return `[${s.toArray().map(v => v.toFixed(2)).join(', ')}]`;
}
// Re-bind every skinned mesh in the subtree after transforms changed.
function rebind(root) {
  root.updateMatrixWorld(true);
  root.traverse((o) => {
    if (o.isSkinnedMesh) o.bind(o.skeleton);
  });
}
async function add(label, x, fn) {
  const gltf = await loader.loadAsync('../assets/girl.glb');
  const wrap = fn(gltf);
  wrap.position.set(x, 0, 0);
  scene.add(wrap);
  const mixer = new THREE.AnimationMixer(wrap);
  const idle = findClip(gltf.animations, 'idle');
  if (idle) mixer.clipAction(idle).play();
  mixers.push(mixer);
  info.push(`${label}: box=${boxOf(wrap)} idle=${idle ? idle.name : 'NONE'}`);
  console.log(info[info.length - 1]);
}
await add('orig', -4.5, (g) => g.scene);
await add('orig+norm', -2.25, (g) => normalizeModel(g.scene, [0.6, 1.7, 0.6]));
await add('clone', 0, (g) => cloneSkinned(g.scene));
await add('clone+norm', 2.25, (g) => normalizeModel(cloneSkinned(g.scene), [0.6, 1.7, 0.6]));
await add('clone+norm+rebind', 4.5, (g) => {
  const w = normalizeModel(cloneSkinned(g.scene), [0.6, 1.7, 0.6]);
  rebind(w);
  return w;
});
window.__charTest = { info, done: true };
const clock = new THREE.Clock();
(function loop() {
  const dt = Math.min(clock.getDelta(), 0.05);
  for (const m of mixers) m.update(dt);
  renderer.render(scene, camera);
  requestAnimationFrame(loop);
})();
</script>
</body>
</html>
