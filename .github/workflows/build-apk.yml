# Builds a real Android APK from the web game with Capacitor.
# Runs on GitHub's free cloud runners (this VM cannot run Gradle).
# The APK (debug build) appears under Actions -> this run -> Artifacts -> the-tower-apk.
# Install it on the phone by allowing "Install unknown apps" for the browser/files app.

name: Build Android APK

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Prepare web folder
        run: |
          mkdir -p www
          cp index.html styles.css www/
          cp -r src assets vendor config www/

      - name: Install Capacitor
        run: npm install @capacitor/core @capacitor/cli @capacitor/android

      - name: Init Capacitor
        run: npx cap init "The Tower" com.ayan.tower --web-dir=www

      - name: Add Android platform
        run: npx cap add android

      - name: Fix duplicate Kotlin classes
        run: |
          cat >> android/app/build.gradle <<'EOF'
          configurations.all {
              exclude group: 'org.jetbrains.kotlin', module: 'kotlin-stdlib-jdk8'
          }
          EOF

      - name: Sync web code
        run: npx cap sync android

      - name: Build debug APK
        run: |
          cd android
          ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: the-tower-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
